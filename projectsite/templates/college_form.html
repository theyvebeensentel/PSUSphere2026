{% extends 'base.html' %}
{% load static %}

{% block content %}
<h4 class="page-title">College Form</h4>
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <div class="card-title">{% if object %}Edit College{% else %}Add New College{% endif %}</div>
            </div>
            <div class="col-md-6">
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form.html' %}
                        <div class="form-group mt-3">
                            <button type="submit" class="btn btn-primary btn-rounded">Submit</button>
                            <a href="{% url 'college-list' %}" class="btn btn-secondary btn-rounded">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

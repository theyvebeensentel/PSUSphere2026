{% extends 'base.html' %}
{% load static %}

{% block content %}
<h4 class="page-title">College</h4>
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div class="card-title">List of Colleges</div>
                <a href="{% url 'college-add' %}" class="btn btn-success btn-rounded">Add College</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>College Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for object in object_list %}
                            <tr>
                                <td>{{ object.college_name }}</td>
                                <td>
                                    <a href="{% url 'college-update' object.id %}" class="text-primary mr-2">Edit</a>
                                    <a href="{% url 'college-delete' object.id %}" class="text-danger">Delete</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="2" class="text-center">No college records found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% include 'includes/pagination.html' %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

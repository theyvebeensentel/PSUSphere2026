{% extends 'base.html' %}
{% load static %}

{% block content %}
<h4 class="page-title">Delete Org Member</h4>
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Delete Member Record</div>
            </div>
            <div class="col-md-6">
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <p>Are you sure you want to delete member record "<strong>{{ object }}</strong>"?</p>
                        <div class="form-group mt-3">
                            <button type="submit" class="btn btn-danger btn-rounded">Confirm Delete</button>
                            <a href="{% url 'orgmember-list' %}" class="btn btn-secondary btn-rounded">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

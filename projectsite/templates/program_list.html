{% extends 'base.html' %}
{% load static %}

{% block content %}
<h4 class="page-title">Program</h4>
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div class="card-title">List of Programs</div>
                <a href="{% url 'program-add' %}" class="btn btn-success btn-rounded">Add Program</a>
            </div>
            <div class="card-body">
                <!-- Search & Dynamic Sort Form -->
                <form method="get" class="row g-3 align-items-center mb-3">
                    <div class="col-md-5">
                        <div class="input-group">
                            <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search ..." class="form-control">
                            <div class="input-group-append">
                                <button type="submit" class="btn btn-outline-secondary">
                                    <i class="la la-search search-icon"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-auto">
                        <label for="smallSelect" class="col-form-label">Sort by</label>
                    </div>
                    <div class="col-auto">
                        <select class="form-control form-control-sm" id="smallSelect" name="sort_by">
                            <option value="prog_name" {% if request.GET.sort_by == "prog_name" %}selected{% endif %}>Program Name</option>
                            <option value="college__college_name" {% if request.GET.sort_by == "college__college_name" %}selected{% endif %}>College</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary btn-sm btn-rounded">Sort</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Program Name</th>
                                <th>College</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for object in object_list %}
                            <tr>
                                <td>{{ object.prog_name }}</td>
                                <td>{{ object.college }}</td>
                                <td>
                                    <a href="{% url 'program-update' object.id %}" class="text-primary mr-2">Edit</a>
                                    <a href="{% url 'program-delete' object.id %}" class="text-danger">Delete</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center">No programs found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
